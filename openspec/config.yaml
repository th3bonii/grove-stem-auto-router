# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Lua script for REAPER (DAW)
  Architecture: Single-file Lua script for stem audio routing
  Testing: No test runner available (REAPER Lua scripts have no standard test suite)
  Style: Lua conventions

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner: null
  layers: []
  linter: null
  formatter: null
  type_checker: null
  coverage: false
  note: "REAPER Lua scripts have no standard testing infrastructure. Manual testing required."
